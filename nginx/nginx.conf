limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=reveal:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;

    # Docker DNS: берем адрес при каждом запросе(хранится в кеше по времени параметра valid)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://app:8000; # Засовываем в переменную адрес нашего сервиса

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $upstream;
    }

    location = /auth/register {
        limit_req zone=register burst=3 nodelay;
        proxy_pass $upstream;
    }

    location ~ ^/notes/[^/]+/reveal$ {
        limit_req zone=reveal burst=10 nodelay;
        proxy_pass $upstream;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $upstream;
    }
}